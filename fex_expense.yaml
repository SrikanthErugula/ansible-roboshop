- name: Set up Frontend configuration
  hosts: exfrnt
  become: yes
  tasks:
  - name: Installing Nginx Server
    ansible.builtin.package:
      name: nginx 
      state: present
  
  - name: Set up Service 
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: yes
  
  - name: Install Nginx
    ansible.builtin.dnf:
      name: nginx
      state: present

  # - name: Remove existing frontend content
  #   ansible.builtin.shell: |
  #     rm -rf /usr/share/nginx/html/*
    
  - name: Remove existing frontend content
    ansible.builtin.shell: rm -rf /usr/share/nginx/html/*
    

  - name: Extract frontend code
    ansible.builtin.unarchive:
      src: /tmp/frontend.zip
      dest: /usr/share/nginx/html
      remote_src: yes

  - name: Copy expense nginx configuration
    ansible.builtin.template:
      src: expense.conf.j2
      dest: /etc/nginx/default.d/expense.conf

  # - name: Start Nginx
  #   ansible.builtin.service:
  #     name: nginx
  #     state: restarted
  #     enabled: yes

  - name: daemon reload enable and start
    ansible.builtin.systemd_service:
      name: nginx
      enabled: true
      state: started
      daemon_reload: true
